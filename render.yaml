services:
  # 1. ONE SHOT FMGE Web API & Frontend Service
  - type: web
    name: oneshot-fmge-web
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: oneshot-fmge-db
          property: connectionString
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. Standalone Cloud Telegram Ingestion Worker (24/7 Persistent MTProto Client)
  - type: worker
    name: oneshot-fmge-telegram-worker
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/worker.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oneshot-fmge-db
          property: connectionString
      - key: SESSION_ENCRYPTION_KEY
        fromService:
          name: oneshot-fmge-web
          type: web
          envVarKey: SESSION_ENCRYPTION_KEY
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  # 3. Persistent PostgreSQL Database
  - name: oneshot-fmge-db
    plan: starter
    databaseName: oneshotfmge
    user: oneshot
