  <text x="25" y="26" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#64748b">12-LEAD ECG · LEADS V1-V4 (ANTERIOR CHEST LEADS) · 25 mm/sec · 10 mm/mV</text>

